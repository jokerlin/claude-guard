name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install zsh
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh
      - run: zsh --version
      - name: Syntax check
        run: zsh -n claude-guard.plugin.zsh && zsh -n tests/run.zsh
      - name: Tests
        run: zsh tests/run.zsh
